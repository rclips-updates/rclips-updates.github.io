name: Save download counts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update downloads.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/rclips-updates/rclips-releases/releases?per_page=100" \
            | jq '[.[] | {key: .tag_name, value: ([.assets[] | select(.name | test("\\.exe$"; "i")) | .download_count] | add // 0)}] | from_entries' > live.json
          jq -s '.[0] as $old | .[1] as $new | ($old + $new) | with_entries(.value = ([($old[.key] // 0), ($new[.key] // 0)] | max))' downloads.json live.json > merged.json
          rm live.json
          if cmp -s merged.json downloads.json; then
            rm merged.json
            echo "No change"
          else
            mv merged.json downloads.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add downloads.json
            git commit -m "Update download counts"
            git push
          fi
